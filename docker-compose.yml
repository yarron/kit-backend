# Имя compose-проекта закреплено ЯВНО. По умолчанию оно берётся из имени
# папки, поэтому переименование каталога тихо создаёт вторую копию стека:
# старые контейнеры продолжают жить, держат порты, и `docker compose down`
# из переименованной папки их не видит.
name: kit-backend

# Local databases. `pnpm db:up` starts them, `pnpm db:down` stops them.
#
# Ports are deliberately NOT the defaults (27017 / 6379 / 8123): a developer
# runs several projects at once, and colliding on the default port is how you
# end up writing test fixtures into another project's database.
volumes:
  mongodb_data:
  postgres_data:
  clickhouse_data:

services:
  mongodb:
    image: "bitnami/mongodb:latest"
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      MONGODB_PORT_NUMBER: 27017
      MONGODB_DATABASE: starter
    restart: always
    ports:
      - "27811:27017"
    volumes:
      - mongodb_data:/bitnami/mongodb

  # Второй слой хранения — для модуля invoice (Prisma). Нужен только если
  # в окружении задан DATABASE_URL.
  postgres:
    image: "postgres:17-alpine"
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    restart: always
    ports:
      - "54811:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: "bitnami/redis:latest"
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_PORT_NUMBER: 6379
    restart: always
    ports:
      - "63811:6379"

  clickhouse:
    image: "clickhouse/clickhouse-server:25.8"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    restart: always
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8124:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Политика логирования — одна и та же локально и на проде: на Railway
      # этот же файл кладётся стартовой командой (pnpm ch:railway-cmd).
      # Файлы РАЗМЕРА (zz-memory.xml, zz-disable-profiler.xml) сюда НЕ
      # монтируются: они посчитаны под 6 GiB инстанса, а сколько памяти у
      # твоего Docker — знает только твой Docker. Локально пусть ClickHouse
      # считает лимит от того, что реально видит.
      - ./clickhouse/config.d/zz-system-log-ttl.xml:/etc/clickhouse-server/config.d/zz-system-log-ttl.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
